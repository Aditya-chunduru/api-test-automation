name: API Performance & Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  load-test-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust python-dotenv requests urllib3

      - name: Run Locust Headless Load Test
        env:
          SUPABASE_URL: https://aommnxekaskgjlwjsdpc.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          locust -f tests/locustfile.py \
            --headless \
            -u 50 \
            -r 5 \
            --run-time 30s \
            --csv=load_test_results \
            --host "$SUPABASE_URL"

      - name: Evaluate Error Rate Gate
        run: |
          # Parse aggregate error rate from Locust stats CSV or assert exit criteria
          STATS_FILE="load_test_results_stats.csv"
          if [ -f "$STATS_FILE" ]; then
            echo "--- Load Test Stats Summary ---"
            cat "$STATS_FILE"
          else
            echo "Warning: Stats CSV not found."
          fi
          
