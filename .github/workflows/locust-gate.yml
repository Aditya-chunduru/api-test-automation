name: Supabase API Load Regression Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust requests urllib3 python-dotenv

      - name: Run Locust Headless Sweep
        run: |
          locust -f tests/locustfile.py \
            --headless \
            -u 50 \
            -r 5 \
            --run-time 30s \
            --csv=load_test_results \
            --host https://aommnxekaskgjlwjsdpc.supabase.co/

      - name: Evaluate CI/CD Gates (Fail Rate <= 1%, P95 <= 500ms)
        run: |
          python -c '
          import csv, sys

          with open("load_test_results_stats.csv", mode="r") as f:
              reader = csv.DictReader(f)
              aggregated = None
              for row in reader:
                  if row["Name"] == "Aggregated":
                      aggregated = row
                      break
              
              if not aggregated:
                  print("❌ Error: Aggregated stats row not found.")
                  sys.exit(1)

              req_count = int(aggregated["Request Count"])
              fail_count = int(aggregated["Failure Count"])
              fail_rate = (fail_count / req_count) if req_count > 0 else 0.0
              p95 = float(aggregated["95%"])

              print(f"📊 Total Requests: {req_count}")
              print(f"⚠️  Failures:        {fail_count} ({fail_rate:.2%})")
              print(f"⏱️  P95 Latency:     {p95}ms")

              failed_gate = False
              if fail_rate > 0.01:
                  print("❌ GATE FAILED: Failure rate exceeds 1%")
                  failed_gate = True
              if p95 > 500:
                  print("❌ GATE FAILED: P95 latency exceeds 500ms")
                  failed_gate = True

              if failed_gate:
                  sys.exit(1)
              print("✅ All performance and error gates passed!")
          '
